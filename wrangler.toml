# Cloudflare Workers Static Assets configuration.
# Deploys the Astro `dist/` directory as a static site. No Worker.
# To add a Worker later (Pass 2 AI features), add `main = "src/worker/..."` and
# `binding = "ASSETS"` back. Note: `run_worker_first = true` was silently ignored
# by CF edge cache for asset paths — do not rely on it for auth gating.

name = "aashishj-com"
compatibility_date = "2026-04-30"

[assets]
directory = "./dist"
# 404 fallback: when a path isn't found, serve dist/404.html if it exists,
# otherwise the platform default 404. Astro emits its own 404 page on build.
not_found_handling = "404-page"
